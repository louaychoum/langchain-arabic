name: CI

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        include:
          - python-version: "3.10"
            minimum-dependencies: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - if: matrix.minimum-dependencies
        run: python -m pip install "langchain-core==0.3.0" "pydantic==2.7.4" "num2words==0.5.14"
      - run: ruff check src tests examples benchmarks
      - run: ruff format --check src tests examples benchmarks
      - run: mypy
      - run: pytest --cov=langchain_arabic --cov-branch --cov-report=term-missing
      - run: python benchmarks/evaluate_diacritics.py --check
      - run: python examples/langchain_chain.py
