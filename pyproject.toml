[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "langchain-arabic"
dynamic = ["version"]
description = "Arabic text post-processing for LLM outputs — diacritics restoration, number-to-word conversion, dialect support, and LangChain integration"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{ name = "Louay Alshoum" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: Linguistic",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Natural Language :: Arabic",
]
dependencies = [
    "langchain-core>=0.3.0,<2",
    "pydantic>=2.7.4,<3",
    "num2words>=0.5.14,<0.6",
]

[project.optional-dependencies]
catt = ["catt-tashkeel>=1.0.1,<2"]
dev = [
    "pytest>=8,<10", "pytest-cov>=5,<8", "pytest-asyncio>=0.24,<2",
    "ruff>=0.17,<0.18", "mypy>=1.13,<2", "build>=1.2,<2", "twine>=6,<7",
]

[project.urls]
Repository = "https://github.com/louaychoum/langchain-arabic"
Issues = "https://github.com/louaychoum/langchain-arabic/issues"
Changelog = "https://github.com/louaychoum/langchain-arabic/releases"

[tool.setuptools.dynamic]
version = {attr = "langchain_arabic._version.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
langchain_arabic = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
strict = true
files = ["src/langchain_arabic"]

[[tool.mypy.overrides]]
module = ["num2words", "catt_tashkeel"]
ignore_missing_imports = true
